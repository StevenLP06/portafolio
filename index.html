    <!--
      Anti-flash de tema: se ejecuta de forma síncrona antes del primer paint
      para aplicar la clase 'dark' sin que el usuario vea un parpadeo del tema
      incorrecto. Debe mantenerse en sincronía con la clave 'theme' que usa
      src/hooks/useTheme.js.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored ? stored === 'dark' : prefersDark;
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {
          /* localStorage no disponible: se mantiene el tema por defecto */
        }
      })();
    </script>
